title: "Cloudflare Workers AI"
description: "Tasks that evaluate content with Cloudflare's Clef decision models on Workers AI."
body: "Send a state and typed questions (yes/no, choice, or score) to the Clef and Clef-flash decision models and get one answer per question with calibrated probabilities. Route flows on the result, for example ticket triage or content moderation, without generating text or parsing LLM output."
